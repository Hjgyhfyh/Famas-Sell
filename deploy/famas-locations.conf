# FAMAS STORE — nginx-сниппет: проксирование /famas/ на локальный Node (127.0.0.1:4488).
# Кладётся в /etc/nginx/snippets/famas-locations.conf (это делает deploy/deploy.sh).
# Подключается строкой `include /etc/nginx/snippets/famas-locations.conf;`
# в server-блоках /etc/nginx/sites-enabled/telepasta — сразу после сниппета sig-stats.
# ВАЖНО: proxy_pass без URI-части — префикс /famas уходит в express как есть (так и задумано).
location ^~ /famas/ {
    proxy_pass http://127.0.0.1:4488;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}
